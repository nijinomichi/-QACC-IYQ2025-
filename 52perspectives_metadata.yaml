project:
  title: "52 Perspectives of Resonance"
  year: 2025–2026
  framework: "CoPhelia³"
  description: >
    52 individual perspectives forming a year-long cycle of resonance fragments.
    Each perspective is a seed for dialogue, reflection, installation, or poetic research.
    The number 52 evokes weeks in a year and the possibility of continuous, living inquiry.

metadata:
  author: "So Hashiguchi"
  location: "Yokohama, Japan"
  type:
